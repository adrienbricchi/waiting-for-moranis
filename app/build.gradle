plugins {
    id 'com.android.application'
    id 'com.google.android.gms.oss-licenses-plugin'
}

def apikeyPropertiesFile = rootProject.file("apikey.properties")
def apikeyProperties = new Properties()
apikeyProperties.load(new FileInputStream(apikeyPropertiesFile))

android {

    namespace = 'org.adrienbricchi.waitingformoranis'
    compileSdk = 37

    defaultConfig {
        applicationId = "org.adrienbricchi.waitingformoranis"
        minSdk = 28
        targetSdk = 37
        versionCode = 24
        versionName "1.4.4"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "TMDB_KEY", '"' + apikeyProperties['TMDB_KEY'] + '"'

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled = false

            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources = false

            // Includes the default ProGuard rules files that are packaged with
            // the Android Gradle plugin.
            // proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        // dataBinding = true
        viewBinding = true
        buildConfig = true
        compose = false
    }
    buildToolsVersion = '37.0.0'

    testOptions {
        unitTests {
            // Return default values for Android framework methods to enable pure JVM testing
            returnDefaultValues = true
        }
        unitTests.all {
            useJUnitPlatform()
        }
    }

    lint {
        abortOnError = false
    }

}

dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])

    def lombok_version = '1.18.48'
    compileOnly "org.projectlombok:lombok:${lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${lombok_version}"

    def room_version = '2.8.5'
    implementation "androidx.room:room-runtime:${room_version}"
    annotationProcessor "androidx.room:room-compiler:${room_version}"
    testImplementation "androidx.room:room-testing:${room_version}"

    def jackson_version = '2.22.3'
    implementation "com.fasterxml.jackson.core:jackson-core:${jackson_version}"
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.22'
    implementation "com.fasterxml.jackson.core:jackson-databind:${jackson_version}"

    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.squareup.picasso3:picasso:3.0.0-alpha06'
    implementation 'com.google.android.gms:play-services-oss-licenses:17.5.2'

    def androidx_navigation_version = '2.10.2'
    implementation "androidx.navigation:navigation-fragment:${androidx_navigation_version}"
    implementation "androidx.navigation:navigation-ui:${androidx_navigation_version}"

    implementation 'androidx.fragment:fragment-ktx:1.9.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.recyclerview:recyclerview-selection:1.2.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'com.google.android.material:material:1.14.0'

    def junit_version = '6.1.3'
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junit_version}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${junit_version}"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit_version}"

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

}
